name: Update whitelist monitoring data
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Collect public RSS reports
        run: python scripts/collect_sources.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/reports.json data/statuses.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports.json data/statuses.json
          git commit -m "Update whitelist monitoring data"
          git push
