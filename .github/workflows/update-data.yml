name: Update whitelist monitoring data
on:
  push:
    paths:
      - 'scripts/collect_sources.py'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
# Monitor-Runet regional pages are paced by the collector (about one request per second).
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Collect API, Monitor Runeta, and public RSS reports
        run: python scripts/collect_sources.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/reports.json data/statuses.json data/monitor.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports.json data/statuses.json data/monitor.json
          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 0
          fi
          git commit -m "Update whitelist monitoring data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
