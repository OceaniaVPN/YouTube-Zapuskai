name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "data/**"
      - "sitemap.xml"
      - "robots.txt"
      - "404.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate SEO files
        run: |
          test -s sitemap.xml
          test -s robots.txt
          test -s 404.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
