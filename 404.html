<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090f1c"><meta name="robots" content="noindex,follow"><title>404 — Белые списки · Россия</title><style>
:root{color-scheme:dark;--bg:#090f1c;--line:#26364d;--muted:#91a1b8;--text:#edf3fb}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% -20%,#1b3150,transparent 48%),radial-gradient(ellipse at 90% 100%,#0b4562,transparent 38%),var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,sans-serif;overflow:hidden}.card{position:relative;width:min(680px,100%);padding:clamp(28px,6vw,54px);text-align:center;border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,#142238ef,#101a2aef);box-shadow:0 24px 90px #0007;overflow:hidden}.logo{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:17px;background:linear-gradient(135deg,#2563eb,#0ea5e9);font-size:25px;box-shadow:0 8px 30px #2563eb55}.code{margin:24px 0 4px;font-size:clamp(76px,18vw,132px);line-height:.9;font-weight:900;letter-spacing:-.09em;background:linear-gradient(120deg,#dbeafe,#60a5fa,#22d3ee);color:transparent;background-clip:text}h1{margin:18px 0 8px;font-size:clamp(22px,5vw,30px)}p{margin:0 auto;color:var(--muted);max-width:470px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:12px;text-decoration:none;font-weight:800;font-size:13px}.primary{color:#06111f;background:linear-gradient(120deg,#93c5fd,#38bdf8)}.secondary{color:var(--text);border:1px solid #344963;background:#172337}.speck{position:fixed;top:-10px;color:#d9f2ff;opacity:.7;pointer-events:none;animation:fall linear infinite}@keyframes fall{to{transform:translateY(110vh) rotate(220deg)}}@media(prefers-reduced-motion:reduce){.speck{display:none}}
</style></head><body><main class="card"><div class="logo">◈</div><div class="code">404</div><h1>Такой страницы нет</h1><p>Похоже, ссылка устарела или адрес был введён с ошибкой. Карта мониторинга и остальные данные сайта на месте — вернись на главную.</p><div class="actions"><a class="primary" href="/">Открыть главную</a><a class="secondary" href="javascript:history.back()">Вернуться назад</a></div></main><script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<32;i++){const s=document.createElement('i');s.className='speck';s.textContent=Math.random()>.5?'✦':'·';s.style.left=Math.random()*100+'vw';s.style.animationDuration=(7+Math.random()*10)+'s';s.style.animationDelay=(-Math.random()*14)+'s';s.style.fontSize=(8+Math.random()*12)+'px';document.body.append(s)}}</script></body></html>
